<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅遊團員名單</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f7f6; --surface:#ffffff; --ink:#16302b; --muted:#5f7873; --line:#d5e2df; --accent:#0f766e; --chip:#e1f0ed;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b19; --surface:#172825; --ink:#e4f1ee; --muted:#93aaa5; --line:#2a403c; --accent:#5fd1c4; --chip:#1f3834;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b19; --surface:#172825; --ink:#e4f1ee; --muted:#93aaa5; --line:#2a403c; --accent:#5fd1c4; --chip:#1f3834;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.6;
}
main{max-width:520px; margin:0 auto; padding:28px 18px 40px}
h1{font-size:1.7rem; margin:0 0 6px; letter-spacing:.04em}
.count{display:inline-block; background:var(--chip); color:var(--accent); font-weight:600; padding:2px 12px; border-radius:999px; font-size:.95rem}
ol{list-style:none; margin:22px 0 0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; counter-reset:n}
li{counter-increment:n; display:flex; align-items:center; gap:14px; padding:14px 18px; font-size:1.1rem; border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li::before{content:counter(n); min-width:1.8em; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; font-size:.95rem}
ol li .en{margin-left:auto;color:var(--muted);font-size:.9rem;letter-spacing:.02em;text-align:right}
ol li .en:empty::after{content:"英文名 —"}
.trip{margin:0 0 2px;color:var(--muted);font-size:1.05rem;letter-spacing:.03em}
.tabs{display:flex;gap:8px;margin:18px 0 16px}
.tabs button{flex:1;padding:10px 0;font:inherit;font-size:1rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section[hidden]{display:none}
.room{margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.room h2{display:flex;justify-content:space-between;align-items:baseline;margin:0;padding:10px 18px;font-size:1rem;background:var(--chip);color:var(--accent)}
.room h2 span{font-weight:400;font-size:.9rem}
.room ul{list-style:none;margin:0;padding:0}
.room li{padding:12px 18px;font-size:1.1rem}
.room li::before{content:none}
.room li+li{border-top:1px solid var(--line)}
.pending{border-style:dashed}
.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px}
#rooms .bar{margin-bottom:16px}
.copy{font:inherit;font-size:.9rem;padding:6px 16px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer}
.copy:active{background:var(--chip)}
.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost{font:inherit;font-size:.9rem;padding:6px 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{margin:14px 0 0;font-size:.95rem;color:var(--muted)}
.note+.note{margin-top:2px}
.ag{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ag label{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:1.05rem;cursor:pointer}
.ag label+label{border-top:1px solid var(--line)}
.ag small{margin-left:8px;color:var(--muted);font-size:.8rem}
.ag input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.checks{list-style:none;margin:22px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.checks li{display:block;padding:0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks li::before{content:none}
.checks li.row,.checks li.head{display:grid;grid-template-columns:1fr repeat(3,3.6rem);align-items:center;padding:0 0 0 18px}
.checks .nm{font-size:1.1rem}
.checks .col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 0;cursor:pointer}
.checks .head{background:var(--chip);color:var(--accent);font-size:.9rem}
.checks .head .col{padding:8px 0;cursor:default}
.checks .head small{font-size:.75rem;color:var(--muted)}
.checks input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.checks .ni{grid-column:1/-1;justify-self:stretch;width:auto;height:auto;min-width:0;margin:0 18px 12px 0;padding:8px 10px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
.checks .ni:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pending h2{background:transparent;color:var(--muted)}
.empty{margin:22px 0 0;padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
</style>
</head>
<body>
<main>
  <h1>旅遊團員名單</h1>
  <p class="trip">2027 北海道 2/14–2/18</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-roster" aria-selected="true" data-tab="roster">名單</button>
    <button role="tab" id="t-rooms" aria-selected="false" data-tab="rooms">房間分配圖</button>
  </div>
  <section id="roster">
  <div class="bar"><span class="count" id="cnt">載入中…</span><button class="copy" data-copy="roster">複製名單</button></div>
  <ol id="rosterList"></ol>
  </section>
  <section id="rooms" hidden>
    <div class="bar"><span class="count" id="rcnt">載入中…</span><button class="copy" data-copy="rooms">複製分房</button></div>
    <div id="roomsList"></div>
  </section>
</main>
<script>
(function(){
  var btns=document.querySelectorAll('.tabs button');
  function show(name){
    if(name!=='rooms')name='roster';
    btns.forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===name?'true':'false')});
    document.getElementById('roster').hidden=name!=='roster';
    document.getElementById('rooms').hidden=name!=='rooms';
  }
  btns.forEach(function(b){b.addEventListener('click',function(){location.hash=b.dataset.tab;show(b.dataset.tab)})});
  window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
  function copyText(t,btn){
    var o=btn.dataset.label||btn.textContent;
    btn.dataset.label=o;
    var done=function(){btn.textContent='已複製';setTimeout(function(){btn.textContent=o},1500)};
    var fallback=function(){
      var a=document.createElement('textarea');
      a.value=t;a.style.position='fixed';a.style.opacity='0';
      document.body.appendChild(a);a.select();
      try{document.execCommand('copy');done()}catch(e){btn.textContent='複製失敗'}
      document.body.removeChild(a);
    };
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback)}else{fallback()}
    }catch(e){fallback()}
  }
  function rosterText(){
    return '2027 北海道 2/14–2/18 旅遊團員名單(共 '+document.querySelectorAll('#roster li').length+' 人)\n'+Array.from(document.querySelectorAll('#roster li')).map(function(li,i){var en=li.querySelector('.en').textContent.trim();return (i+1)+'. '+li.querySelector('.zh').textContent+(en?' / '+en:'')}).join('\n');
  }
  function roomsText(){
    return '2027 北海道 2/14–2/18 房間分配\n'+Array.from(document.querySelectorAll('#rooms .room')).map(function(r){
      var n=r.querySelector('h2').firstChild.textContent;
      var m=Array.from(r.querySelectorAll('li')).map(function(li){return li.textContent}).join('、');
      return n+':'+m;
    }).join('\n');
  }
  document.querySelectorAll('.copy').forEach(function(b){
    b.addEventListener('click',function(){copyText(b.dataset.copy==='rooms'?roomsText():rosterText(),b)});
  });
  var SUPABASE_URL='https://fzucoyskkhscvlwsckmr.supabase.co';
  var SUPABASE_KEY='sb_publishable_7sWTXxZwqg1NCHONKHZ_Og_5bb7ssyx';
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=text;return e}
  function render(rows){
    var list=document.getElementById('rosterList');
    list.textContent='';
    rows.forEach(function(r){
      var li=el('li');
      li.appendChild(el('span','zh',r.name_zh+(r.note?'('+r.note+')':'')));
      li.appendChild(el('span','en',r.name_en||''));
      list.appendChild(li);
    });
    document.getElementById('cnt').textContent='共 '+rows.length+' 人';
    var groups={},keys=[],pending=[];
    rows.forEach(function(r){
      if(r.room_no==null){pending.push(r);return}
      if(!groups[r.room_no]){groups[r.room_no]=[];keys.push(r.room_no)}
      groups[r.room_no].push(r);
    });
    keys.sort(function(a,b){return a-b});
    var box=document.getElementById('roomsList');
    box.textContent='';
    function card(title,members,pend){
      var d=el('div','room'+(pend?' pending':''));
      var h=el('h2',null,title);
      h.appendChild(el('span',null,members.length+' 人'));
      d.appendChild(h);
      var ul=el('ul');
      members.forEach(function(m){ul.appendChild(el('li',null,m.name_zh+(m.note?'('+m.note+')':'')))});
      d.appendChild(ul);
      box.appendChild(d);
    }
    keys.forEach(function(k){card('房間 '+k,groups[k],false)});
    if(pending.length)card('尚未分配',pending,true);
    document.getElementById('rcnt').textContent='共 '+keys.length+' 間房';
  }
  function fail(){
    document.getElementById('cnt').textContent='讀取失敗,請稍後再試';
    document.getElementById('rcnt').textContent='讀取失敗,請稍後再試';
  }
  fetch(SUPABASE_URL+'/rest/v1/members?select=sort,name_zh,name_en,note,room_no&order=sort.asc',{headers:{apikey:SUPABASE_KEY}})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(render).catch(fail);
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
