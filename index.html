<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅遊團員名單</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f7f6; --surface:#ffffff; --ink:#16302b; --muted:#5f7873; --line:#d5e2df; --accent:#0f766e; --chip:#e1f0ed;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b19; --surface:#172825; --ink:#e4f1ee; --muted:#93aaa5; --line:#2a403c; --accent:#5fd1c4; --chip:#1f3834;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b19; --surface:#172825; --ink:#e4f1ee; --muted:#93aaa5; --line:#2a403c; --accent:#5fd1c4; --chip:#1f3834;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.6;
}
main{max-width:520px; margin:0 auto; padding:28px 18px 40px}
h1{font-size:1.7rem; margin:0 0 6px; letter-spacing:.04em}
.count{display:inline-block; background:var(--chip); color:var(--accent); font-weight:600; padding:2px 12px; border-radius:999px; font-size:.95rem}
ol{list-style:none; margin:22px 0 0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; counter-reset:n}
li{counter-increment:n; display:flex; align-items:center; gap:14px; padding:14px 18px; font-size:1.1rem; border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li::before{content:counter(n); min-width:1.8em; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; font-size:.95rem}
ol li .en{margin-left:auto;color:var(--muted);font-size:.9rem;letter-spacing:.02em;text-align:right}
ol li .en:empty::after{content:"英文名 —"}
ol li.has-rm{flex-wrap:wrap;row-gap:4px}
ol li .rm{flex-basis:100%;margin-left:2.8rem;font-size:.9rem;color:var(--muted)}
ol li input.ri{flex:1 1 100%;min-width:0;margin:0 0 0 2.8rem;padding:7px 10px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
ol li input.ri:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.trip{margin:0 0 2px;color:var(--muted);font-size:1.05rem;letter-spacing:.03em}
.checks li.row .col{color:var(--accent);font-weight:700;font-size:1.1rem;cursor:default}
.checks li.row .col.no{color:var(--muted);font-weight:400}
.checks li.row label.col{cursor:pointer}
.admin{margin:22px 0 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.admin .note{margin:0;min-height:1.4em}
#loginForm{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
#loginForm[hidden]{display:none}
.admin input[type="email"],.admin input[type="password"]{font:inherit;font-size:1rem;padding:9px 12px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.admin input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ag .mk{color:var(--accent);font-weight:700}
.ag .mk.no{color:var(--muted);font-weight:400}
.ag input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.checks .rm{grid-column:1/-1;margin:-4px 18px 12px 0;font-size:.9rem;color:var(--muted)}
.tabs{display:flex;gap:8px;margin:18px 0 16px}
.tabs button{flex:1;padding:10px 0;font:inherit;font-size:1rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section[hidden]{display:none}
.room{margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.room h2{display:flex;justify-content:space-between;align-items:baseline;margin:0;padding:10px 18px;font-size:1rem;background:var(--chip);color:var(--accent)}
.room h2 span{font-weight:400;font-size:.9rem}
.room ul{list-style:none;margin:0;padding:0}
.room li{padding:12px 18px;font-size:1.1rem}
.room li::before{content:none}
.room li+li{border-top:1px solid var(--line)}
.pending{border-style:dashed}
.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px}
#rooms .bar{margin-bottom:16px}
.copy{font:inherit;font-size:.9rem;padding:6px 16px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer}
.copy:active{background:var(--chip)}
.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost{font:inherit;font-size:.9rem;padding:6px 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{margin:14px 0 0;font-size:.95rem;color:var(--muted)}
.note+.note{margin-top:2px}
.ag{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ag label{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:1.05rem;cursor:pointer}
.ag label+label{border-top:1px solid var(--line)}
.ag small{margin-left:8px;color:var(--muted);font-size:.8rem}
.ag input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.checks{list-style:none;margin:22px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.checks li{display:block;padding:0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks li::before{content:none}
.checks li.row,.checks li.head{display:grid;grid-template-columns:1fr repeat(3,3.6rem);align-items:center;padding:0 0 0 18px}
.checks .nm{font-size:1.1rem}
.checks .col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 0;cursor:pointer}
.checks .head{background:var(--chip);color:var(--accent);font-size:.9rem}
.checks .head .col{padding:8px 0;cursor:default}
.checks .head small{font-size:.75rem;color:var(--muted)}
.checks input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.checks .ni{grid-column:1/-1;justify-self:stretch;width:auto;height:auto;min-width:0;margin:0 18px 12px 0;padding:8px 10px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
.checks .ni:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pending h2{background:transparent;color:var(--muted)}
.empty{margin:22px 0 0;padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
</style>
</head>
<body>
<main>
  <h1>旅遊團員名單</h1>
  <p class="trip">2027 北海道 2/14–2/18</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-roster" aria-selected="true" data-tab="roster">名單</button>
    <button role="tab" id="t-rooms" aria-selected="false" data-tab="rooms">房間分配圖</button>
    <button role="tab" id="t-check" aria-selected="false" data-tab="check">核對表</button>
  </div>
  <section id="roster">
  <div class="bar"><span class="count" id="cnt">載入中…</span><button class="copy" data-copy="roster">複製名單</button></div>
  <ol id="rosterList"></ol>
  </section>
  <section id="rooms" hidden>
    <div class="bar"><span class="count" id="rcnt">載入中…</span><button class="copy" data-copy="rooms">複製分房</button></div>
    <div id="roomsList"></div>
  </section>
  <section id="check" hidden>
    <div class="bar"><span class="count" id="ccnt">載入中…</span><button class="copy" data-copy="notes">複製備註</button></div>
    <div class="ag" id="agency" hidden></div>
    <p class="note" id="amt1"></p>
    <p class="note" id="amt2"></p>
    <ul class="checks" id="checkList"></ul>
    <div class="admin">
      <p class="note" id="cmsg"></p>
      <button class="ghost" id="adminBtn" type="button">管理者登入</button>
      <p class="note" id="ver">頁面版本 r5</p>
      <form id="loginForm" hidden>
        <input type="email" id="lemail" placeholder="Email" autocomplete="username" required>
        <input type="password" id="lpw" placeholder="密碼" autocomplete="current-password" required>
        <button class="ghost" type="submit">登入</button>
      </form>
    </div>
  </section>
</main>
<script>
(function(){
  var btns=document.querySelectorAll('.tabs button');
  function show(name){
    if(name!=='rooms'&&name!=='check')name='roster';
    btns.forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===name?'true':'false')});
    document.getElementById('roster').hidden=name!=='roster';
    document.getElementById('rooms').hidden=name!=='rooms';
    document.getElementById('check').hidden=name!=='check';
  }
  btns.forEach(function(b){b.addEventListener('click',function(){location.hash=b.dataset.tab;show(b.dataset.tab)})});
  window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
  function copyText(t,btn){
    var o=btn.dataset.label||btn.textContent;
    btn.dataset.label=o;
    var done=function(){btn.textContent='已複製';setTimeout(function(){btn.textContent=o},1500)};
    var fallback=function(){
      var a=document.createElement('textarea');
      a.value=t;a.style.position='fixed';a.style.opacity='0';
      document.body.appendChild(a);a.select();
      try{document.execCommand('copy');done()}catch(e){btn.textContent='複製失敗'}
      document.body.removeChild(a);
    };
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback)}else{fallback()}
    }catch(e){fallback()}
  }
  function rosterText(){
    return '2027 北海道 2/14–2/18 旅遊團員名單(共 '+document.querySelectorAll('#roster li').length+' 人)\n'+Array.from(document.querySelectorAll('#roster li')).map(function(li,i){var en=li.querySelector('.en').textContent.trim();return (i+1)+'. '+li.querySelector('.zh').textContent+(en?' / '+en:'')}).join('\n');
  }
  function roomsText(){
    return '2027 北海道 2/14–2/18 房間分配\n'+Array.from(document.querySelectorAll('#rooms .room')).map(function(r){
      var n=r.querySelector('h2').firstChild.textContent;
      var m=Array.from(r.querySelectorAll('li')).map(function(li){return li.textContent}).join('、');
      return n+':'+m;
    }).join('\n');
  }
  document.querySelectorAll('.copy').forEach(function(b){
    b.addEventListener('click',function(){copyText(b.dataset.copy==='rooms'?roomsText():(b.dataset.copy==='notes'?notesText():rosterText()),b)});
  });
  var SUPABASE_URL='https://fzucoyskkhscvlwsckmr.supabase.co';
  var SUPABASE_KEY='sb_publishable_7sWTXxZwqg1NCHONKHZ_Og_5bb7ssyx';
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=text;return e}
  var SESSION_KEY='hk-admin-session';
  var session=null;
  try{session=JSON.parse(localStorage.getItem(SESSION_KEY))}catch(e){session=null}
  var rowsCache=[];
  var settingsCache=null;
  function msg(text){document.getElementById('cmsg').textContent=text}
  function saveSession(s){
    session=s;
    try{if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SESSION_KEY)}catch(e){}
  }
  function toSession(j){
    return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+Math.max((j.expires_in||3600)-60,0)*1000};
  }
  function authPost(grant,body){
    return fetch(SUPABASE_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){if(!r.ok)throw new Error('auth '+r.status);return r.json()})
      .then(toSession);
  }
  function getToken(){
    if(!session)return Promise.reject(new Error('auth'));
    if(Date.now()<session.expires_at)return Promise.resolve(session.access_token);
    return authPost('refresh_token',{refresh_token:session.refresh_token}).then(function(s){saveSession(s);return s.access_token});
  }
  function patchTable(table,filter,field,val){
    var body={};body[field]=val;
    return getToken().then(function(tok){
      return fetch(SUPABASE_URL+'/rest/v1/'+table+'?'+filter,{method:'PATCH',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});
    }).then(function(r){
      if(!r.ok)throw new Error('http '+r.status);
      return r.json();
    }).then(function(arr){if(!arr.length)throw new Error('denied')});
  }
  function setAdminUI(){
    document.getElementById('adminBtn').textContent=session?'登出':'管理者登入';
    if(session)document.getElementById('loginForm').hidden=true;
  }
  function onSaveError(e){
    var m=String(e&&e.message);
    if(m==='auth'||/^auth /.test(m)||m==='http 401'){
      saveSession(null);setAdminUI();renderCheck();msg('登入已過期,請重新登入');
    }else if(m==='denied'||m==='http 403'){
      msg('沒有修改權限,請確認登入的是管理帳號');
    }else{
      msg('儲存失敗,請稍後再試');
    }
  }
  document.getElementById('adminBtn').addEventListener('click',function(){
    if(session){saveSession(null);setAdminUI();renderCheck();msg('已登出')}
    else{var f=document.getElementById('loginForm');f.hidden=!f.hidden}
  });
  document.getElementById('loginForm').addEventListener('submit',function(ev){
    ev.preventDefault();
    msg('登入中…');
    authPost('password',{email:document.getElementById('lemail').value.trim(),password:document.getElementById('lpw').value})
      .then(function(s){
        saveSession(s);
        document.getElementById('lpw').value='';
        setAdminUI();renderCheck();
        msg('已登入,可直接點選勾選框');
      })
      .catch(function(){msg('登入失敗,請確認帳號與密碼')});
  });
  setAdminUI();
  function notesText(){
    var lines=rowsCache.filter(function(r){return r.remark&&r.remark.trim()}).map(function(r){return r.name_zh+':'+r.remark.trim()});
    return lines.length?'特殊備註\n'+lines.join('\n'):'尚無特殊備註';
  }
  function money(n){return 'NT$'+n.toLocaleString('en-US')}
  function renderAgency(){
    var box=document.getElementById('agency');
    box.textContent='';
    if(!settingsCache){box.hidden=true;return}
    box.hidden=false;
    [['agency_deposit_paid','旅行社訂金'],['agency_balance_paid','旅行社餘款']].forEach(function(c){
      var lb=el('label');
      var sp=el('span',null,c[1]);
      sp.appendChild(el('small',null,'統一匯款'));
      lb.appendChild(sp);
      if(session){
        var cb=document.createElement('input');
        cb.type='checkbox';
        cb.checked=!!settingsCache[c[0]];
        cb.setAttribute('aria-label',c[1]+'已匯款');
        cb.addEventListener('change',function(){
          var want=cb.checked;
          cb.disabled=true;
          patchTable('trip_settings','id=eq.1',c[0],want)
            .then(function(){settingsCache[c[0]]=want;msg('')
              ;cb.disabled=false})
            .catch(function(e){cb.checked=!want;cb.disabled=false;onSaveError(e)});
        });
        lb.appendChild(cb);
      }else{
        lb.style.cursor='default';
        var on=!!settingsCache[c[0]];
        lb.appendChild(el('span','mk'+(on?'':' no'),on?'✓':'—'));
      }
      box.appendChild(lb);
    });
  }
  function renderAmounts(){
    var a1=document.getElementById('amt1'),a2=document.getElementById('amt2');
    if(!settingsCache||!rowsCache.length||rowsCache[0].deposit_paid===undefined){a1.textContent='';a2.textContent='';return}
    var dp=settingsCache.deposit_per,bp=settingsCache.balance_per,n=rowsCache.length;
    var dPaid=rowsCache.filter(function(r){return r.deposit_paid}).length*dp;
    function bal(r){return r.balance_amount!=null?r.balance_amount:bp}
    var bPaid=0,bTotal=0,over=[];
    rowsCache.forEach(function(r){
      bTotal+=bal(r);
      if(r.balance_paid)bPaid+=bal(r);
      if(r.balance_amount!=null&&r.balance_amount!==bp)over.push(r.name_zh+' '+money(r.balance_amount));
    });
    a1.textContent='訂金每人 '+money(dp)+',已收 '+money(dPaid)+' / '+money(dp*n);
    a2.textContent='餘款每人 '+money(bp)+(over.length?'('+over.join('、')+')':'')+',已收 '+money(bPaid)+' / '+money(bTotal);
  }
  function renderRoster(){
    var list=document.getElementById('rosterList');
    list.textContent='';
    var admin=!!session;
    rowsCache.forEach(function(r){
      var li=el('li');
      li.appendChild(el('span','zh',r.name_zh+(r.note?'('+r.note+')':'')));
      li.appendChild(el('span','en',r.name_en||''));
      if(r.remark!==undefined){
        if(admin){
          li.className='has-rm';
          var ri=document.createElement('input');
          ri.type='text';
          ri.className='ri';
          ri.placeholder='備註';
          ri.value=r.remark||'';
          ri.setAttribute('aria-label',r.name_zh+' 備註');
          ri.addEventListener('change',function(){
            var v=ri.value.trim();
            patchTable('members','sort=eq.'+r.sort,'remark',v===''?null:v)
              .then(function(){r.remark=v===''?null:v;msg('');renderCheck()})
              .catch(function(e){ri.value=r.remark||'';onSaveError(e)});
          });
          li.appendChild(ri);
        }else if(r.remark&&r.remark.trim()){
          li.className='has-rm';
          li.appendChild(el('span','rm','備註:'+r.remark.trim()));
        }
      }
      list.appendChild(li);
    });
  }
  function renderCheck(){
    renderRoster();
    var rows=rowsCache;
    var list=document.getElementById('checkList');
    var cnt=document.getElementById('ccnt');
    list.textContent='';
    if(!rows.length||rows[0].deposit_paid===undefined){
      cnt.textContent='尚未啟用';
      document.getElementById('agency').hidden=true;
      renderAmounts();
      return;
    }
    renderAgency();
    renderAmounts();
    var admin=!!session;
    if(admin&&rows[0].remark===undefined)msg('備註欄位尚未建立,請先在 Supabase 執行 supabase-checklist-full');
    var cols=[['deposit_paid','訂金'],['balance_paid','餘款'],['passport_ok','護照']];
    var head=el('li','head');
    head.appendChild(el('span'));
    cols.forEach(function(c){
      var h=el('span','col');
      h.style.cursor='default';
      h.appendChild(el('b',null,c[1]));
      h.appendChild(el('small',null,rows.filter(function(r){return r[c[0]]}).length+'/'+rows.length));
      head.appendChild(h);
    });
    list.appendChild(head);
    rows.forEach(function(r){
      var li=el('li','row');
      li.appendChild(el('span','nm',r.name_zh+(r.note?'('+r.note+')':'')));
      cols.forEach(function(c){
        if(admin){
          var lb=el('label','col');
          var cb=document.createElement('input');
          cb.type='checkbox';
          cb.checked=!!r[c[0]];
          cb.setAttribute('aria-label',r.name_zh+' '+c[1]);
          cb.addEventListener('change',function(){
            var want=cb.checked;
            cb.disabled=true;
            patchTable('members','sort=eq.'+r.sort,c[0],want)
              .then(function(){r[c[0]]=want;msg('');renderCheck()})
              .catch(function(e){cb.checked=!want;cb.disabled=false;onSaveError(e)});
          });
          lb.appendChild(cb);
          li.appendChild(lb);
        }else{
          li.appendChild(el('span','col'+(r[c[0]]?'':' no'),r[c[0]]?'✓':'—'));
        }
      });
      if(r.remark!==undefined){
        if(admin){
          var ni=document.createElement('input');
          ni.type='text';
          ni.className='ni';
          ni.placeholder='特殊備註';
          ni.value=r.remark||'';
          ni.setAttribute('aria-label',r.name_zh+' 特殊備註');
          ni.addEventListener('change',function(){
            var v=ni.value.trim();
            patchTable('members','sort=eq.'+r.sort,'remark',v===''?null:v)
              .then(function(){r.remark=v===''?null:v;msg('');renderRoster()})
              .catch(function(e){ni.value=r.remark||'';onSaveError(e)});
          });
          li.appendChild(ni);
        }else if(r.remark&&r.remark.trim()){
          li.appendChild(el('span','rm','備註:'+r.remark.trim()));
        }
      }
      list.appendChild(li);
    });
    var all=rows.filter(function(r){return r.deposit_paid&&r.balance_paid&&r.passport_ok}).length;
    cnt.textContent='全部完成 '+all+' / '+rows.length;
  }
  function render(rows,settings){
    document.getElementById('cnt').textContent='共 '+rows.length+' 人';
    var groups={},keys=[],pending=[];
    rows.forEach(function(r){
      if(r.room_no==null){pending.push(r);return}
      if(!groups[r.room_no]){groups[r.room_no]=[];keys.push(r.room_no)}
      groups[r.room_no].push(r);
    });
    keys.sort(function(a,b){return a-b});
    var box=document.getElementById('roomsList');
    box.textContent='';
    function card(title,members,pend){
      var d=el('div','room'+(pend?' pending':''));
      var h=el('h2',null,title);
      h.appendChild(el('span',null,members.length+' 人'));
      d.appendChild(h);
      var ul=el('ul');
      members.forEach(function(m){ul.appendChild(el('li',null,m.name_zh+(m.note?'('+m.note+')':'')))});
      d.appendChild(ul);
      box.appendChild(d);
    }
    keys.forEach(function(k){card('房間 '+k,groups[k],false)});
    if(pending.length)card('尚未分配',pending,true);
    document.getElementById('rcnt').textContent='共 '+keys.length+' 間房';
    rowsCache=rows;
    settingsCache=settings;
    renderCheck();
  }
  function fail(){
    document.getElementById('cnt').textContent='讀取失敗,請稍後再試';
    document.getElementById('rcnt').textContent='讀取失敗,請稍後再試';
    document.getElementById('ccnt').textContent='讀取失敗,請稍後再試';
  }
  function get(cols){
    return fetch(SUPABASE_URL+'/rest/v1/members?select='+cols+'&order=sort.asc',{headers:{apikey:SUPABASE_KEY}})
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()});
  }
  var BASE='sort,name_zh,name_en,note,room_no';
  var CHK=',deposit_paid,balance_paid,passport_ok';
  var EXT=',remark,balance_amount';
  var membersP=get(BASE+CHK+EXT).catch(function(){return get(BASE+CHK)}).catch(function(){return get(BASE)});
  var settingsP=fetch(SUPABASE_URL+'/rest/v1/trip_settings?select=*&id=eq.1',{headers:{apikey:SUPABASE_KEY}})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(a){return a[0]||null})
    .catch(function(){return null});
  Promise.all([membersP,settingsP]).then(function(res){render(res[0],res[1])}).catch(fail);
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
